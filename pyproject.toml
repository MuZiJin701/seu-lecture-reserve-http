[project]
name = "seu-lecture-reserve-http"
version = "0.1.0"
description = "SEU lecture reservations with a local HTTP administration console"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32,<3",
    "cryptography>=43",
    "ddddocr>=1.5,<2",
    "pillow>=10,<13",
    "python-dotenv>=1,<2",
    "tzdata",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
seu-reserve = "seu_reserve.cli:main"
seu-reserve-web = "seu_reserve.web:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "mypy>=1.13,<2",
    "types-requests>=2.32",
    "httpx2>=2,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seu_reserve*"]

[tool.setuptools.package-data]
seu_reserve = ["web_assets/*"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["seu_reserve"]

[[tool.mypy.overrides]]
module = "ddddocr"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
